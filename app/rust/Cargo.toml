[package]
name = "ost_frb"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
flutter_rust_bridge = "=2.13.0"
once_cell = "1"
ost-core = { path = "../../crates/ost-core" }
ost-microsoft = { path = "../../crates/ost-microsoft" }
teams-cli = { path = "../..", features = ["audio", "video-codec"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls-webpki-roots"], default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ost-platform = { path = "../../crates/ost-platform" }
# Android must package the shared C++ runtime used by Oboe. Static linkage can
# leave C++ ABI symbols unresolved when Cargo combines Oboe with this cdylib.
oboe-sys = { version = "0.6.1", features = ["shared-stdcxx"] }

[target.'cfg(target_os = "linux")'.dependencies]
teams-cli = { path = "../..", features = ["video-capture"] }

[target.'cfg(target_os = "windows")'.dependencies]
teams-cli = { path = "../..", features = ["video-capture-windows"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
